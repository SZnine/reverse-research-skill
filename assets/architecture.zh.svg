<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Reverse Research Skills architecture</title>
<desc id="desc">Evidence-driven investigation loop with three target adapters, conditional tooling and state support, operator observations, and claim-matched verification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#25344b} .title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#53657a}.edge{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}</style>
<rect width="1200" height="1040" rx="20" fill="#ffffff"/>

<text x="40" y="45" class="title" text-anchor="start">技能分工与调用关系</text>
<text x="40" y="75" class="body" text-anchor="start">分析方法、工具、进度记录与结果检查</text>
<rect x="430" y="105" width="340" height="88" rx="12" fill="#eef3ff" stroke="#adc0e4"/>
<text x="600.0" y="136" class="label" text-anchor="middle">要解决的问题</text>
<text x="600.0" y="164" class="body" text-anchor="middle">目标 · 测试范围 · 预期结果</text>
<path d="M600 193 V230" class="edge "/>
<rect x="430" y="230" width="340" height="110" rx="12" fill="#eef3ff" stroke="#adc0e4"/>
<text x="600.0" y="261" class="label" text-anchor="middle">reverse-research</text>
<text x="600.0" y="289" class="body" text-anchor="middle">决定下一步怎么查</text>
<text x="600.0" y="313" class="body" text-anchor="middle">换方法，或结束分析</text>
<path d="M600 340 V460" class="edge "/>
<text x="612" y="407" class="small" text-anchor="start">开始检查</text>
<rect x="430" y="460" width="340" height="126" rx="12" fill="#eef3ff" stroke="#adc0e4"/>
<text x="600.0" y="491" class="label" text-anchor="middle">分析与测试</text>
<text x="600.0" y="519" class="body" text-anchor="middle">看代码 / 跑程序 / 修改后对比</text>
<text x="600.0" y="543" class="body" text-anchor="middle">记录结果，找出还没查清的问题</text>
<path d="M430 512 H395 V284 H430" class="edge "/>
<text x="371" y="365" class="small" text-anchor="end">没有查清</text>
<text x="371" y="387" class="small" text-anchor="end">换个方法</text>
<rect x="30" y="430" width="330" height="376" rx="16" fill="#f4faf8" stroke="#b9d9ce"/>
<text x="195" y="462" class="label" text-anchor="middle">按分析对象选择</text>
<rect x="47" y="481" width="296" height="88" rx="12" fill="#e5f4ee" stroke="#9cccb8"/>
<text x="195.0" y="512" class="label" text-anchor="middle">reverse-apk</text>
<text x="195.0" y="540" class="body" text-anchor="middle">APK / DEX / smali / JNI</text>
<rect x="47" y="581" width="296" height="88" rx="12" fill="#e5f4ee" stroke="#9cccb8"/>
<text x="195.0" y="612" class="label" text-anchor="middle">reverse-native</text>
<text x="195.0" y="640" class="body" text-anchor="middle">二进制 / ABI / 调试</text>
<rect x="47" y="681" width="296" height="88" rx="12" fill="#e5f4ee" stroke="#9cccb8"/>
<text x="195.0" y="712" class="label" text-anchor="middle">reverse-protocol</text>
<text x="195.0" y="740" class="body" text-anchor="middle">协议 / 文件 / 存档 / 解析</text>
<path d="M430 306 H195 V430" class="edge optional"/>
<text x="206" y="325" class="small" text-anchor="start">按目标选择</text>
<path d="M360 549 H430" class="edge optional"/>
<rect x="855" y="230" width="315" height="110" rx="12" fill="#f1f3f7" stroke="#bac4d2"/>
<text x="1012.5" y="261" class="label" text-anchor="middle">reverse-state</text>
<text x="1012.5" y="289" class="body" text-anchor="middle">记进度，保留重要文件</text>
<text x="1012.5" y="313" class="body" text-anchor="middle">清理临时文件，方便下次继续</text>
<path d="M855 284 H770" class="edge optional"/>
<text x="812" y="270" class="small" text-anchor="middle">继续</text>
<rect x="855" y="460" width="315" height="110" rx="12" fill="#f1f3f7" stroke="#bac4d2"/>
<text x="1012.5" y="491" class="label" text-anchor="middle">reverse-toolbox</text>
<text x="1012.5" y="519" class="body" text-anchor="middle">查找、安装和检查工具</text>
<text x="1012.5" y="543" class="body" text-anchor="middle">用到时再准备</text>
<path d="M855 507 H770" class="edge optional"/>
<text x="812" y="492" class="small" text-anchor="middle">工具</text>
<path d="M770 550 H831 V318 H855" class="edge optional"/>
<text x="843" y="375" class="small" text-anchor="start">记录</text>
<text x="843" y="396" class="small" text-anchor="start">进度与结果</text>
<path d="M600 586 V700" class="edge "/>
<text x="612" y="633" class="small" text-anchor="start">确认原因或准备交付</text>
<rect x="430" y="700" width="340" height="110" rx="12" fill="#fff1dc" stroke="#d5ad67"/>
<text x="600.0" y="731" class="label" text-anchor="middle">reverse-verify</text>
<text x="600.0" y="759" class="body" text-anchor="middle">检查是否真正解决问题</text>
<text x="600.0" y="783" class="body" text-anchor="middle">实际使用 / 保存 / 重启后再测</text>
<path d="M430 755 H380 V284 H430" class="edge "/>
<text x="371" y="841" class="small" text-anchor="end">尚未确认 → 继续查</text>
<rect x="855" y="700" width="315" height="110" rx="12" fill="#f1f3f7" stroke="#bac4d2"/>
<text x="1012.5" y="731" class="label" text-anchor="middle">请用户操作</text>
<text x="1012.5" y="759" class="body" text-anchor="middle">点几下或看一眼就能确认时</text>
<text x="1012.5" y="783" class="body" text-anchor="middle">给出步骤，等用户返回结果</text>
<path d="M1012 700 V614 H751 V586" class="edge optional"/>
<text x="1024" y="647" class="small" text-anchor="start">操作结果</text>
<path d="M600 810 V900" class="edge "/>
<text x="614" y="858" class="small" text-anchor="start">检查通过</text>
<path d="M770 575 H803 V942 H770" class="edge "/>
<text x="815" y="854" class="small" text-anchor="start">简单问题已查清</text>
<text x="815" y="876" class="small" text-anchor="start">直接回答</text>
<rect x="430" y="900" width="340" height="88" rx="12" fill="#eef3ff" stroke="#adc0e4"/>
<text x="600.0" y="931" class="label" text-anchor="middle">给出结果</text>
<text x="600.0" y="959" class="body" text-anchor="middle">原因、修改内容及测试结果</text>
<path d="M40 1016 H90" class="edge "/>
<text x="102" y="1022" class="small" text-anchor="start">分析步骤</text>
<path d="M430 1016 H480" class="edge optional"/>
<text x="492" y="1022" class="small" text-anchor="start">需要时调用或传递结果</text>
</svg>